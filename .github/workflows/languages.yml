name: Languages

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build languages card
        env:
          GH_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
        run: python3 .github/scripts/languages.py

      - name: Commit if changed
        run: |
          git config user.name "grundimdev"
          git config user.email "256989399+grundimdev@users.noreply.github.com"
          git add assets/languages.svg
          git diff --cached --quiet || (git commit -m "Update languages card" && git push)
