name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2F81F7&color_dots=#ebedf0,#c6dbfb,#8fb8f7,#4f8ff0,#2F81F7
            dist/snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#58A6FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
